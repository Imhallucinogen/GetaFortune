<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GetaFortune — You might just get a fortune</title>
    <!-- Importing Premium Inter Display Font from Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0B0F19;
            --bg-card: #151D30;
            --bg-nav: #0F1626;
            --accent-glow: #3B82F6;
            --accent-glow-hover: #2563EB;
            --text-primary: #F3F4F6;
            --text-secondary: #9CA3AF;
            --border-muted: #24324F;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            line-height: 1.6; 
            margin: 0; 
            padding: 0; 
            background-color: var(--bg-main); 
            color: var(--text-primary);
            overflow-x: hidden;
        }

        /* Premium Navigation Bar */
        nav { 
            background: var(--bg-nav); 
            border-bottom: 1px solid var(--border-muted);
            padding: 1.25rem 2rem; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        nav .brand { 
            font-weight: 700;
            font-size: 1.3rem;
            color: #fff;
            text-decoration: none; 
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        nav .nav-links a { 
            color: var(--text-secondary); 
            text-decoration: none; 
            margin-left: 20px; 
            font-weight: 500;
            font-size: 0.95rem;
            transition: color 0.2s ease, transform 0.2s ease;
            display: inline-block;
        }

        nav .nav-links a:hover { 
            color: #fff; 
            transform: translateY(-1px);
        }

        nav .welcome-badge {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-right: 15px;
            padding: 4px 10px;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            border: 1px solid var(--border-muted);
        }

        /* Structural Container wrapper */
        .container { 
            max-width: 900px; 
            margin: 40px auto; 
            padding: 0 20px; 
            box-sizing: border-box;
        }

        /* Standardized Premium Input Fields UI Component */
        input[type="text"], input[type="password"], textarea { 
            width: 100%; 
            padding: 14px 16px; 
            margin: 12px 0 24px 0; 
            box-sizing: border-box; 
            background-color: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-muted);
            border-radius: 8px;
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-glow);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
        }

        /* Generic Premium Button Component */
        button, .btn-action { 
            background: var(--accent-glow); 
            color: white; 
            padding: 12px 24px; 
            border: none; 
            cursor: pointer; 
            border-radius: 8px; 
            font-weight: 600;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            transition: background 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
        }

        button:hover, .btn-action:hover { 
            background: var(--accent-glow-hover); 
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.35);
        }

        button:active, .btn-action:active {
            transform: scale(0.98);
        }
        
        h2 { font-weight: 700; letter-spacing: -0.7px; font-size: 2rem; margin-bottom: 8px; }
        p.subtitle { color: var(--text-secondary); font-size: 1.1rem; margin-top: 0; margin-bottom: 30px; }
    </style>
</head>
<body>

    <nav>
        <a href="/" class="brand">$ GetaFortune</a>
                <div class="nav-links">
            <!-- Publicly visible links (Accessible with or without login) -->
             <a href="/about">ℹ️ About Us</a>
            <a href="/stories">📖 Read Stories</a>          

            {% if current_user.is_authenticated %}
                <!-- Private links (Visible only when logged in) -->
                <a href="/inbox" style="position: relative;">
                    📥 Inbox
                    {% if unread_messages_count > 0 %}
                        <span style="position: absolute; top: -8px; right: -12px; background-color: #EF4444; color: white; border-radius: 50%; padding: 2px 6px; font-size: 0.7rem; font-weight: 700; line-height: 1; border: 2px solid var(--bg-nav);">
                            {{ unread_messages_count }}
                        </span>
                    {% endif %}
                </a>
                <a href="/create">✍️ Write Story</a>
                <a href="/logout">🚪 Logout</a>
            {% else %}
                <!-- Authentication entry shortcuts -->
                <a href="/login">🔑 Login</a>
                <a href="/register" style="background: var(--accent-glow); color: #fff; padding: 8px 16px; border-radius: 6px; box-shadow: 0 4px 10px rgba(59,130,246,0.15); text-decoration: none;">Get Started</a>
            {% endif %}
        </div>

    </nav>

    <div class="container">
        {% block content %} {% endblock %}
    </div>

</body>
</html>
