{% extends 'base.html' %}

{% block content %}
    <div style="background: var(--bg-card); padding: 40px; border: 1px solid var(--border-muted); border-radius: 12px; max-width: 480px; margin: 60px auto; box-shadow: 0 10px 40px rgba(0,0,0,0.3);">
        <h2 style="margin-top: 0; margin-bottom: 8px;">Create Unique Username</h2>
        <p style="color: var(--text-secondary); margin-top: 0; margin-bottom: 30px; font-size: 0.95rem;">Register a permanent username.</p>
        
        <form method="POST">
            <label style="font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-secondary);">Username</label>
            <input type="text" name="username" placeholder="Pick a unique handle..." required>

            <label style="font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-secondary);">Account Password</label>
            <input type="password" name="password" placeholder="Choose a tough sequence..." required>

            <button type="submit" style="width: 100%; margin-top: 10px; padding: 14px;">Create</button>
        </form>
        <p style="margin-bottom: 0; margin-top: 25px; font-size: 0.9rem; text-align: center; color: var(--text-secondary);">
            Already matched? <a href="/login" style="color: var(--accent-glow); text-decoration: none; font-weight: 500;">Login Here</a>.
        </p>
    </div>
{% endblock %}
